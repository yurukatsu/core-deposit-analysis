[project]
name = "core-deposit-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "numpyro>=0.19.0",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "arviz>=0.23.1",
    "pandas>=3.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coredeposit"]
