[project]
name = "coredeposit"
version = "0.1.0"
description = "Core deposit analysis library with two-type survival model and Weibull hazard functions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.1",
    "numpyro>=0.19.0",
    "scipy>=1.17.0",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]"]
cuda11 = ["jax[cuda11]"]

[dependency-groups]
dev = [
    "arviz>=0.23.1",
    "pandas>=3.0.0",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coredeposit"]
